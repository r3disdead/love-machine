<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LOVE MACHINE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
        background:#000;color:#fff;font-family:'Comic Sans MS',cursive;
        min-height:100dvh;
        display:flex;flex-direction:column;
        overflow:hidden;touch-action:manipulation;user-select:none;
        -webkit-overflow-scrolling:touch;
    }
    h1{
        position:fixed;top:0;left:0;right:0;z-index:1000;
        text-align:center;padding:20px 0;background:rgba(0,0,0,0.95);
        font-size:clamp(40px,12vw,100px);color:#ff1493;
        text-shadow:0 0 50px #ff1493,0 0 100px #ff69b4;letter-spacing:10px;
        pointer-events:none;
    }
    #game-container{
        flex:1;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        padding:20px 20px 40px;
        gap:30px;
    }
    #game-frame{
        width:100%;max-width:900px;
        aspect-ratio:800/600;
        border:16px solid #ff1493;border-radius:36px;
        overflow:visible;
        box-shadow:0 0 120px #ff1493,inset 0 0 90px rgba(255,20,147,0.8);
        background:#000;position:relative;
    }
    @media (max-width:600px){
        #game-frame{max-width:500px;border:14px solid #ff1493;border-radius:32px;}
        #game-container{gap:20px;padding:15px 15px 30px;}
    }
    #game{width:100%;height:100%;position:relative;overflow:visible;}
    #scene-svg,#character-svg{
        position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;
    }
    #character-svg{z-index:10;}
    #instructions{
        position:fixed;top:50%;right:15px;transform:translateY(-50%);
        padding:12px 18px;background:rgba(0,0,0,0.7);border-radius:14px;
        font-size:clamp(16px,4.8vw,24px);color:#ff69b4;text-align:left;
        text-shadow:0 0 18px #ff1493;opacity:0;transition:opacity 1s;
        width:200px;z-index:1000;pointer-events:none;
    }
    #instructions.visible{opacity:1;}
    #input-zone{
        padding:16px;background:rgba(0,0,0,0.95);text-align:center;
        border-top:4px solid #ff1493;
        width:100%;max-width:900px;
        box-shadow:0 -10px 30px rgba(255,20,147,0.4);
        border-radius:12px;
    }
    input{
        width:100%;max-width:420px;padding:14px;background:#111;
        border:3px solid #ff1493;border-radius:12px;color:#ff69b4;
        text-align:center;font-size:17px;
    }
    button{
        margin-top:12px;padding:12px 32px;background:#ff1493;color:#000;
        border:none;border-radius:12px;font-weight:bold;font-size:17px;
    }
    .heart-fly{
        position:fixed;pointer-events:none;z-index:9999;
        font-size:72px;color:#ff1493;text-shadow:0 0 45px #ff69b4;
        animation:cosmicFly 2.2s ease-out forwards;
    }
    .heart-permanent{
        position:fixed;pointer-events:none;z-index:9998;
        font-size:64px;color:#ff1493;
        text-shadow:0 0 40px #ff69b4,0 0 80px #ff1493;
        animation:pulse 3s infinite alternate;opacity:0.9;
    }
    @keyframes cosmicFly{
        0%{transform:scale(0.8) rotate(0deg);opacity:1;}
        50%{transform:scale(1.5) rotate(720deg);opacity:1;}
        100%{transform:translate(var(--dx),var(--dy)) rotate(1080deg) scale(0.4);opacity:0.5;}
    }
    @keyframes pulse{
        from{transform:scale(1);}
        to{transform:scale(1.3);}
    }
</style>
</head>
<body>

<h1>LOVE MACHINE</h1>

<div id="game-container">
    <div id="game-frame">
        <div id="game">
            <svg id="scene-svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet"></svg>
            <svg id="character-svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
    </div>

    <div id="input-zone">
        <label>Your lovely inscription ID</label><br>
        <input type="text" id="inscriptionId" placeholder="paste love_message ID + press Enter">
        <button onclick="loadInscription()">LOAD LOVE</button>
    </div>
</div>

<div id="instructions"></div>

<script>
    const game = document.getElementById('game');
    const charSvg = document.getElementById('character-svg');
    const instructions = document.getElementById('instructions');
    const inputField = document.getElementById('inscriptionId');

    const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    instructions.innerHTML = isMobile 
        ? "Swipe → move<br>Double tap → jump<br>Long press → send love" 
        : "← → Move<br>↑ Jump<br>SPACE = SEND LOVE";

    const VIEW_WIDTH = 800;
    const VIEW_HEIGHT = 600;
    const CHAR_FOOT_OFFSET = 1.0;
    const CHAR_HALF_WIDTH = 50;
    const HEART_HALF_WIDTH = 32;
    const COLLISION_TOLERANCE = 50;
    const GRAVITY = 1.4;
    const JUMP_VEL = -30;
    const MOVE_SPEED = 18;

    let x = 0, y = 0, vy = 0, jumping = false;
    let lastShot = 0;
    const permanentHearts = []; // On garde TOUS les cœurs permanents
    const keys = {};

    function clearHearts(){
        document.querySelectorAll('.heart-fly,.heart-permanent').forEach(h=>h.remove());
        permanentHearts.length = 0;
    }

    async function loadInscription(){
        clearHearts();
        const id = inputField.value.trim();
        if(!id) return;
        try{
            const resp = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent('https://ordinals.com/content/' + id)}`);
            if(!resp.ok) throw new Error('Fetch failed');
            let svgText = await resp.text();
            svgText = svgText.replace(/href="\/content\//g,'href="https://ordinals.com/content/');
            const doc = new DOMParser().parseFromString(svgText,'image/svg+xml');
            const images = doc.querySelectorAll('image');
            if(images.length < 6){ alert("Need 6+ layers!"); return; }

            const sceneHTML = Array.from(images).slice(0,-1).map(i=>`<image href="${i.getAttribute('href')}" width="800" height="600"/>`).join('');
            const charHref = images[images.length-1].getAttribute('href');

            document.getElementById('scene-svg').innerHTML = sceneHTML;
            document.getElementById('character-svg').innerHTML = `
<image href="${charHref}" width="800" height="600" x="0" y="0"/>`;
                
            instructions.classList.add('visible');
            x = 0;
            y = 0;
            vy = 0;
        }catch(e){ 
            alert("Load failed: " + e.message); 
            console.error(e); 
        }
    }

    function shoot(){
        if(Date.now() - lastShot < 120) return; // un peu plus lent pour éviter le spam
        lastShot = Date.now();

        const rect = game.getBoundingClientRect();
        const scaleX = rect.width/800;
        const scaleY = rect.height/600;
        const baseX = rect.left + rect.width/2 + x*scaleX;
        const baseY = rect.top + rect.height*CHAR_FOOT_OFFSET + y*scaleY;

        const count = 12 + Math.floor(Math.random()*6);

        let permanentDx = 0, permanentDy = 0;

        // Première vague (proche) + choix aléatoire pour le cœur permanent
        for(let i=0;i<count;i++){
            const spread = 0.6 + Math.random()*0.4; // entre 0.6 et 1.0
            const dx = (Math.random()-0.5)*800*spread;
            const dy = (Math.random()-0.5)*600*spread;

            createFlyingHeart(baseX, baseY, dx, dy);

            // On choisit un des cœurs de cette vague pour devenir permanent
            if(i === Math.floor(Math.random()*count)){
                permanentDx = dx;
                permanentDy = dy;
            }
        }

        // Seconde vague (plus loin)
        for(let i=0;i<count;i++){
            const spread = 1.2 + Math.random()*0.6; // entre 1.2 et 1.8
            const dx = (Math.random()-0.5)*800*spread;
            const dy = (Math.random()-0.5)*600*spread;
            createFlyingHeart(baseX, baseY, dx, dy);
        }

        // Ajout d'UN SEUL cœur permanent par tir
        createPermanentHeart(baseX + permanentDx, baseY + permanentDy);
    }

    function createFlyingHeart(baseX, baseY, dx, dy){
        const fly = document.createElement('div');
        fly.className='heart-fly';
        fly.textContent='♥';
        fly.style.left=baseX+'px';
        fly.style.top=baseY+'px';
        fly.style.setProperty('--dx',dx+'px');
        fly.style.setProperty('--dy',dy+'px');
        document.body.appendChild(fly);
        setTimeout(()=>fly.remove(),2400);
    }

    function createPermanentHeart(posX, posY){
        const perm = document.createElement('div');
        perm.className='heart-permanent';
        perm.textContent='♥';
        perm.style.left=posX+'px';
        perm.style.top=posY+'px';
        document.body.appendChild(perm);
        permanentHearts.push(perm);
    }

    function loop(){
        const rect = game.getBoundingClientRect();
        const scaleX = rect.width / 800;
        const scaleY = rect.height / 600;

        if (keys.ArrowLeft || keys.KeyA) x -= MOVE_SPEED;
        if (keys.ArrowRight || keys.KeyD) x += MOVE_SPEED;

        let prevY = y;
        y += vy;
        vy += GRAVITY;

        const prevFootY = rect.top + rect.height * CHAR_FOOT_OFFSET + prevY * scaleY;
        const charFootY = rect.top + rect.height * CHAR_FOOT_OFFSET + y * scaleY;
        const charFootX = rect.left + rect.width / 2 + x * scaleX;

        const platforms = permanentHearts.map(h => ({
            y: parseFloat(h.style.top) + 32,
            x: parseFloat(h.style.left) + 32,
            isGround: false
        }));

        // Sol du cadre toujours là
        if (charFootX >= rect.left && charFootX <= rect.right) {
            platforms.push({
                y: rect.top + rect.height,
                isGround: true
            });
        }

        platforms.sort((a, b) => a.y - b.y);

        for (const p of platforms) {
            let xOverlap = p.isGround || Math.abs(charFootX - p.x) < (CHAR_HALF_WIDTH + HEART_HALF_WIDTH);
            if (vy > 0 && prevFootY <= p.y && charFootY >= p.y && xOverlap) {
                y = (p.y - rect.top - rect.height * CHAR_FOOT_OFFSET) / scaleY;
                vy = 0;
                jumping = false;
                break;
            }
        }

        // Reset uniquement si on tombe vraiment très bas
        if (charFootY > rect.top + rect.height + 3 * window.innerHeight) {
            x = 0;
            y = 0;
            vy = 0;
            jumping = false;
        }

        charSvg.style.transform = `translate(${x * scaleX}px, ${y * scaleY}px)`;
        requestAnimationFrame(loop);
    }

    // Contrôles tactiles
    let touchId=null, touchStartX=0, lastTap=0, longPressTimer=null;
    game.addEventListener('touchstart',e=>{
        e.preventDefault();
        for(const t of e.changedTouches){
            if(touchId!==null) continue;
            touchId=t.identifier;
            touchStartX=t.clientX;
            const now=Date.now();
            if(now-lastTap<320){ if(!jumping){ jumping=true; vy=JUMP_VEL; }}
            lastTap=now;
            clearTimeout(longPressTimer);
            longPressTimer=setTimeout(()=>{shoot();},500);
        }
    },{passive:false});

    game.addEventListener('touchmove',e=>{
        e.preventDefault();
        for(const t of e.changedTouches){
            if(t.identifier!==touchId) continue;
            const delta=t.clientX-touchStartX;
            x += delta/2;
            touchStartX = t.clientX;
        }
    },{passive:false});

    game.addEventListener('touchend',()=>{ 
        if(touchId!==null){ touchId=null; clearTimeout(longPressTimer); } 
    });

    // Clavier
    window.addEventListener('keydown', e => {
        if(!keys[e.code]){
            keys[e.code] = true;
            if(e.code === 'ArrowUp' && !jumping){ jumping = true; vy = JUMP_VEL; }
            if(e.code === 'Space'){ e.preventDefault(); shoot(); }
        }
    });

    window.addEventListener('keyup', e => {
        keys[e.code] = false;
    });

    inputField.addEventListener('keypress', e => { if(e.key==='Enter') loadInscription(); });

    window.addEventListener('load', () => {
        inputField.focus();
    });

    requestAnimationFrame(loop);
</script>
</body>
</html>
